<!doctype html>
<html lang="en" data-theme="anemo" data-mode="dark">
  <head><meta charset="utf-8" /><title>harness</title></head>
  <body><!--
    The same wrapper the Shell puts a page in. Without min-w-0 a flex child
    refuses to shrink below its content, so a wide table makes the whole page
    scroll sideways — and a harness that omits it reports a layout bug the app
    does not have, or hides one it does.
  -->
  <div class="flex gap-8 p-4"><main class="min-w-0 flex-1" id="app"></main></div>
  <script type="module" src="/src/harness/main.js"></script></body>
</html>
