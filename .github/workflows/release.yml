# Builds the two artefacts the project already expects to exist:
#
#   - ghcr.io/<owner>/mimir  — the image deploy/mimir.yaml points at
#   - release binaries + checksums.txt — what the self-updater downloads and
#     verifies, and refuses to install without
#
# :latest is a release, not a branch tip. The panel pulls :latest, so pointing
# it at main meant the hosted instance ran a build stamped "dev" that no
# self-hoster could install, while the newest release sat a week behind it.
# The two were never the same image. Now a version tag publishes :latest and
# main publishes :edge, so "the hosted instance runs this code" is true of the
# artefact and not only of the repository.
#
# Binaries are published on a version tag only, because the updater compares
# tags and an untagged build is not something it should offer.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  # A pull request runs the tests and nothing else. Without this the suite
  # first ran *after* the merge, so a red test arrived on main and the PR that
  # broke it was already closed — and auto-merge, which is supposed to wait
  # for green, had no check to wait for.
  pull_request:
  workflow_dispatch:

# Two pushes in quick succession race for the same :edge tag, and whichever
# build finishes last wins — which can leave :edge on the *older* commit.
# Superseding a branch build is safe: its only output is a tag that is about
# to be overwritten anyway.
#
# A tag build is not cancelled. Its output is a release, and a half-published
# one — binaries uploaded, checksums.txt missing — is worse than a duplicate:
# the updater refuses a release without checksums, so the release would exist
# and be uninstallable.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  REGISTRY: ghcr.io
  # Spelled out rather than taken from github.repository, which is
  # "kristianwind/mimir" here and "kw/mimir" on the Gitea mirror — where the
  # push then failed with "permission_denied: create_package", because it was
  # asking to create a package for a GitHub user called kw. The image has one
  # name wherever it is built from.
  IMAGE: kristianwind/mimir

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go vet ./...
      - run: go test ./...
      # A build whose formatting has drifted still passes tests, and the
      # drift compounds. Fail here instead.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v node_modules || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      # The frontend has its own tests. They cover the fetch wrapper, whose
      # failure modes are the ones that reach a user as nonsense: a proxy's
      # HTML error page arriving as "Unexpected token <" rather than as 502.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web tests
        working-directory: web
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm test

  # Published from GitHub only, even though this same file runs on the Gitea
  # mirror too.
  #
  # Both forges used to build every tag and both pushed :latest — the run
  # lists show `image: success` on Gitea and on GitHub for the same tag — so
  # two builds of one commit raced and whichever finished last won.
  #
  # Two builds of the same source are not the same bytes, so the digest of a
  # release was settled by whichever runner was quicker that day. That leaves
  # "which artefact is deployed" without an answer, and "which builder
  # produced it" too, if one of them is ever compromised.
  #
  # An earlier version of this comment claimed a measured digest mismatch on
  # production as proof. That was wrong: it compared `docker image inspect
  # .Id` against the registry's *config* digest, which are different
  # identifiers and never match. The right comparison is RepoDigests against
  # the manifest digest, and by that measure production has matched GHCR
  # exactly every time. The race is real; that evidence for it was not.
  #
  # Tests still run on both, deliberately: Gitea's runner is what gates
  # auto-merge, and losing that would cost more than it saves.
  image:
    needs: test
    # Not on a pull request: a PR is not a thing to publish. Neither tag rule
    # below matches one (is_default_branch is false, ref_type is not a tag),
    # so this would build for several minutes and push nothing.
    if: github.server_url == 'https://github.com' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # GHCR_TOKEN first so the self-hosted forge can publish too.
      #
      # On GitHub, secrets.GITHUB_TOKEN is minted per run and already carries
      # packages:write. On Gitea the same name is a *Gitea* token, which GHCR
      # answers with "denied: denied" — so the mirror builds the image and then
      # cannot push it, and the panel keeps pulling a stale :latest. A personal
      # access token with write:packages, stored as GHCR_TOKEN (and GHCR_USER
      # if it is not the repository owner), fixes that without changing
      # anything on GitHub's side.
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USER || 'kristianwind' }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          # A release builds for arm64 too — a Yggdrasil host may be a Pi or
          # an Apple-silicon VM, and a single-arch image fails there with the
          # same unhelpful "denied" as a missing one. A push to main does not:
          # every host that pulls this image today is x86_64, and the arm64
          # half is compiled under QEMU, which is most of the wall clock of a
          # deploy. Tags stay universal; main stays quick.
          platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    # The image too, not just the tests, and this is not tidiness.
    #
    # v0.5.1 published every binary and checksums.txt while its image job was
    # still grinding — 56 minutes against a normal 7 to 11 — so the release
    # existed, the self-updater would offer it, and the panel pulling :latest
    # got the previous version. Hosted and self-hosted diverge exactly there,
    # which is the divergence this file was rewritten to end.
    #
    # Making the release wait on the image means a half-published version is
    # not reachable: either both artefacts exist or neither does.
    needs: [test, image]
    # GitHub only, and here it is not about racing at all: action-gh-release
    # writes to whichever forge it is running on, so the Gitea copy aimed the
    # release at Gitea while the self-updater reads api.github.com. It had
    # been failing on every tag — v0.4.3 and v0.4.4 both show
    # `binaries: failure` on Gitea — which is a broken job nobody was looking
    # at, on the path that installs updates.
    if: github.ref_type == 'tag' && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The frontend is embedded at compile time. web/dist is committed so a
      # clean checkout builds, but the release gets a fresh bundle rather
      # than whatever was last committed.
      - run: npm ci --prefix web && npm run build --prefix web

      - name: Build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
                -o "dist/mimir_${os}_${arch}" ./cmd/mimir
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" \
                -o "dist/mimir-mine_${os}_${arch}" ./cmd/mimir-mine
          done

      # The updater refuses a release with no checksums, so this file is not
      # optional decoration — without it the release is uninstallable.
      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt && cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
