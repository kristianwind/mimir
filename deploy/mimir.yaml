gameskill:
  id: mimir
  name: "Mimir"
  category: "Apps"
  description: "Genshin Impact build advisor: Enka and GOOD import, artifact optimizer and a resin plan ranked by damage per resin"
  author: "kristianwind"
  version: 11
  icon: "app"

  docker:
    image: "ghcr.io/kristianwind/mimir:latest"
    data_path: /data
    # keep_entrypoint is deliberately off. With it on, startup.command is
    # passed as the container's Cmd — and since the image's ENTRYPOINT is
    # "mimir", the process was invoked as `mimir /bin/sh -c serve`, printed
    # its usage and exited. Yggdrasil also skips mounting a minimal
    # /etc/passwd when it is on, which leaves the panel's own uid unresolvable
    # inside the image.
    #
    # No `user:` either: the panel runs the container as the account that owns
    # the data directory, and the image makes no assumptions about which uid
    # that is.

  install:
    image: "ghcr.io/kristianwind/mimir:latest"
    script: |
      mkdir -p /data
      echo "Mimir data directory ready"
      echo
      echo "Nothing else needs to be run here."
      echo "Open Mimir in the browser:"
      echo "  - the login page creates the first administrator"
      echo "  - the System page fetches the game data"

  startup:
    # Raw argv rather than a shell string: no /bin/sh, no quoting, no
    # interaction with the image's entrypoint.
    exec: ["mimir", "serve"]
    done_regex: 'msg=listening'

  ports:
    - { name: web, default: 8080, protocol: tcp }

  variables:
    - key: MIMIR_BASE_URL
      name: "Public URL"
      type: string
      default: "http://localhost:8080"
      hint: "The origin the PWA and push notifications are served from"

    - key: MIMIR_USER_AGENT
      name: "Enka User-Agent"
      type: string
      default: "mimir/0.1 (+https://github.com/kristianwind/mimir)"
      hint: "Enka.Network asks integrators for a contactable agent string rather than a generic one"

    - key: MIMIR_SECURE_COOKIES
      name: "Secure session cookies"
      type: bool
      default: true
      hint: "Leave on unless you are serving over plain http on a LAN"

    - key: MIMIR_ALLOW_REGISTRATION
      name: "Allow self-registration"
      type: bool
      default: false
      hint: "Off by default: this is a personal instance, not a public service. Tick this as well as 'Offered as a paid service' below, or the public pages appear with no way to sign up."

    # Selling it. Every one of these is blank on a self-hosted install, and
    # then Mimir has no public pages, no signup, no billing and no expiry —
    # the software is free and running it yourself holds nothing back. Only
    # the one instance that is offered as a service fills them in.
    - key: MIMIR_HOSTED
      name: "Offered as a paid service"
      type: bool
      default: false
      hint: "Leave off. This turns on the public pages — what it is, what it costs, the terms — and signup, which only make sense on an instance somebody is selling. On your own copy they would be an advert in your own house."

    - key: MIMIR_STRIPE_SECRET_KEY
      name: "Stripe secret key"
      type: string
      default: ""
      secret: true
      hint: "sk_test_... while testing, sk_live_... in earnest. Blank means no subscriptions."

    - key: MIMIR_STRIPE_WEBHOOK_SECRET
      name: "Stripe webhook signing secret"
      type: string
      default: ""
      secret: true
      hint: "whsec_..., shown when you create the endpoint at <your URL>/api/stripe/webhook. Send a snapshot payload and subscribe to customer.subscription.created/updated/deleted only. Without this secret every event is refused, because the signature is the only thing stopping anyone granting themselves a subscription."

    - key: MIMIR_STRIPE_PUBLISHABLE_KEY
      name: "Stripe publishable key"
      type: string
      default: ""
      hint: "pk_... Not a secret: it is embedded in every checkout page by design."

    - key: MIMIR_STRIPE_PRICE_MONTHLY
      name: "Stripe price ID (monthly)"
      type: string
      default: ""
      hint: "price_... Prices are per mode: one made in live mode is invisible to a test key."

    - key: MIMIR_STRIPE_PRICE_YEARLY
      name: "Stripe price ID (yearly)"
      type: string
      default: ""
      hint: "price_... The product needs a tax code set in Stripe or every checkout is rejected; Mimir's is txcd_10103000."

    # Kvasir, the AI layer. Optional and additive: it explains what the engine
    # calculated and answers questions about it, and every figure it writes is
    # checked back against the numbers it was given. It never computes one, so
    # leaving these blank removes the advice and nothing else — no card, no
    # page, no request.
    # Mimir ships no analytics and does not choose one for you. This is the
    # seam: whatever you put here is written into every page's <head>, exactly
    # as typed. Empty on a fresh install, and it stays empty until you decide
    # otherwise.
    #
    # It is a rune field rather than a page in the app on purpose. This becomes
    # a script element on every page, so anyone who could write it could run
    # code in every visitor's browser — including yours. Here it can only be
    # changed by somebody who can already restart the server.
    - key: MIMIR_HEAD_HTML
      name: "Extra markup for <head>"
      type: string
      default: ""
      hint: "For an analytics tag, or anything else that belongs in the head. Inserted verbatim, so paste the whole element — e.g. <script defer data-domain=\"example.com\" src=\"https://plausible.example.com/js/script.js\"></script>. A cookieless analytics service needs no consent banner; one that sets cookies does, and that is yours to arrange. Leave blank for none."

    - key: MIMIR_LLM_BASE_URL
      name: "LLM endpoint (OpenAI-compatible)"
      type: string
      default: ""
      hint: "e.g. http://100.124.14.128:1234/v1 for LM Studio. Blank switches Kvasir off. Note that a container cannot reach the host's 127.0.0.1 — use the machine's LAN or tailscale address."

    - key: MIMIR_LLM_MODEL
      name: "LLM model"
      type: string
      default: ""
      hint: "Blank serves whatever the endpoint defaults to. Size matters more than context here: the largest fact sheet Mimir builds is about 4k tokens, so any modern model fits it, but a small one starts answering from what it knows about Genshin instead of from the sheet. Measured on a 96-character roster, a 12B model called a character \"your highest constellation character\" when thirteen were tied at that constellation — it had picked the famous one. A 26B model got the same brief right six times out of six. Mimir deletes any number it cannot find in the fact sheet, but that check cannot see a claim like this, so 20B+ is the sensible floor."

    - key: MIMIR_LLM_API_KEY
      name: "LLM API key"
      type: string
      default: ""
      secret: true

    - key: MIMIR_LLM_THINKING
      name: "Let the model think first"
      type: bool
      default: false
      hint: "Off by default. Kvasir asks for a short answer built from a fact sheet; a reasoning model spends the whole token budget and most of the wait on a chain of thought nobody reads. Switch on only if a model answers badly without it."

    - key: MIMIR_LLM_MAX_TOKENS
      name: "LLM answer budget (tokens)"
      type: string
      default: "4000"
      hint: "A model that reasons before answering charges its thinking to this budget before writing a word, so keep it well above the length of the answer itself. Too low looks like an empty reply."

    - key: MIMIR_LLM_TIMEOUT
      name: "LLM timeout (seconds)"
      type: string
      default: "90"
      hint: "How long one call to the model may take. Kept under the server's own two-minute write timeout, so a slow answer times out with a message rather than arriving after the browser gave up."

    # The beacon is on, reports to mimir.guide, and is disclosed to the
    # administrator on first sign-in with a one-click decline. Nothing here
    # controls it, deliberately: an environment variable would let whoever
    # writes the deployment answer on the operator's behalf, and this is the
    # one setting that has to be the operator's own. It lives in the database,
    # set from Mimir's System page.

    - key: MIMIR_REPO
      name: "Release repository"
      type: string
      default: "kristianwind/mimir"
      hint: "Where Mimir checks for new versions. It reports what it finds; updating the container is this panel's job, not Mimir's."

  # One button whose result you can read.
  #
  # An earlier version of this comment said Restart never pulls. That was
  # wrong, and measuring it is what proved it wrong: recreateAndStart calls
  # pullImageRetry one line above Create, unconditionally, so every Restart
  # does fetch. Production went 0.4.1 to 0.4.3 across a single restart with
  # nothing else touching the box.
  #
  # The reason to have this block is subtler and worse:
  #
  #     func (s *Server) pullImageRetry(ctx context.Context, image string) {
  #         if err := s.docker.PullImage(ctx, image, io.Discard); err != nil {
  #             s.docker.PullImage(ctx, image, io.Discard) //nolint:errcheck
  #         }
  #     }
  #
  # Two attempts, then it gives up and returns nothing. No error propagates.
  # An unreachable registry, an expired credential or a rate limit does not
  # stop the restart: the container comes up on the LOCAL image and the panel
  # reports success. Restart deploys right up until the moment it silently
  # does not, and the two look identical from the panel.
  #
  # That is what the version echo below is for. It is the only thing in the
  # sequence that says which image actually arrived.
  #
  # image: is deliberately absent. Unset, the pull targets docker.image — this
  # app's own — and that pull IS the update. The field exists for apps whose
  # update needs a different toolchain than they run on.
  #
  # The script cannot veto a bad release either: the pull happens before it and
  # the container is recreated whether it succeeds or fails. So it is not a
  # gate anywhere. It is a witness.
  update:
    label: "Update Mimir"
    script: |
      # /bin/sh, not bash, and root in an ephemeral container with the data
      # directory at /data. Nothing to migrate: the image is immutable, and
      # Mimir applies its own schema changes on start.
      set -e
      echo "Pulled image reports:"
      /usr/local/bin/mimir version

  backup:
    include: ["."]
