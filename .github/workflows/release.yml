# Builds the two artefacts the project already expects to exist:
#
#   - ghcr.io/<owner>/mimir  — the image deploy/mimir.yaml points at
#   - release binaries + checksums.txt — what the self-updater downloads and
#     verifies, and refuses to install without
#
# The image is rebuilt on every push to main so the rune's :latest is never
# stale. Binaries are published on a version tag only, because the updater
# compares tags and an untagged build is not something it should offer.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go vet ./...
      - run: go test ./...
      # A build whose formatting has drifted still passes tests, and the
      # drift compounds. Fail here instead.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v node_modules || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          # arm64 as well as amd64: a Yggdrasil host may be a Pi or an
          # Apple-silicon VM, and a single-arch image fails there with the
          # same unhelpful "denied" as a missing one.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The frontend is embedded at compile time. web/dist is committed so a
      # clean checkout builds, but the release gets a fresh bundle rather
      # than whatever was last committed.
      - run: npm ci --prefix web && npm run build --prefix web

      - name: Build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
                -o "dist/mimir_${os}_${arch}" ./cmd/mimir
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" \
                -o "dist/mimir-mine_${os}_${arch}" ./cmd/mimir-mine
          done

      # The updater refuses a release with no checksums, so this file is not
      # optional decoration — without it the release is uninstallable.
      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt && cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
